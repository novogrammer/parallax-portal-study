<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parallax-portal-study</title>
  </head>
  <body>
    <canvas class="p-home-canvas" aria-hidden="true"></canvas>
    <main>
      <section class="p-home-hero">
        <div class="p-bookend-copy">
          <p class="p-eyebrow">Parallax Portal / WebGL Study</p>
          <h1>Depth follows<br>the scroll.</h1>
          <p>固定CanvasとDOMの窓を使った、垂直パララックスの基準実装。</p>
        </div>
      </section>

      <section class="p-home-introduction" aria-labelledby="warm-depth-title">
        <div class="p-home-introduction__inner" data-portal-id="warm-depth">
          <div class="p-portal-copy">
            <p class="p-eyebrow">Portal 01 / Introduction</p>
            <h2 id="warm-depth-title">Warm depth</h2>
            <p>近景・中景・遠景を、実際のZ距離で分離した検証Scene。</p>
          </div>
        </div>
      </section>

      <section class="p-home-showcase" data-portal-id="cool-depth" aria-labelledby="cool-depth-title">
        <div class="p-portal-copy p-portal-copy--right">
          <p class="p-eyebrow">Portal 02 / Showcase</p>
          <h2 id="cool-depth-title">Cool depth</h2>
          <p>独立したSceneとCameraを、同じCanvasへscissor描画。</p>
        </div>
      </section>

      <section class="p-home-footer">
        <div class="p-bookend-copy">
          <p class="p-eyebrow">End of study</p>
          <h2>Two portals.<br>One canvas.</h2>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
